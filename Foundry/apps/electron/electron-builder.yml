appId: ai.taskmanager.foundry
productName: Foundry
directories:
  output: dist/installers
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - package.json
asar: false
npmRebuild: false
buildDependenciesFromSource: false
mac:
  target: dmg
  category: public.app-category.productivity
  icon: assets/icon-512.png
linux:
  target: AppImage
  category: Office
  icon: assets/icon-512.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon-256.png
  sign: null
